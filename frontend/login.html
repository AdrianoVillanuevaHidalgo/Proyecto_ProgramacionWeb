<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrativo - Ritmo de Detalles</title>
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
      <!-- Bootstrap CSS v5.3.8 -->
      <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
      />
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body class="bg-light d-flex flex-column min-vh-100">

    <header class="bg-white shadow-sm py-3 mb-4">
      <div class="container d-flex justify-content-between align-items-center">
        <img src="img/logo.jpg" alt="Logo de Ritmo de Detalles" height="80" width="170">
        <a href="index.html" class="btn btn-outline-secondary btn-sm">&larr; Volver a la Tienda</a>
      </div>
    </header>

    <!-- Formulario-->
    <main class="container my-auto">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5">
          
          <div class="card border-0 shadow p-4 rounded-4">
            <div class="text-center mb-4">
              <h1 class="h4 fw-bold text-dark mt-2">Login</h1>
              <p class="text-muted small">Panel de gestion de pedidos e inventario</p>
            </div>

            <!-- Formulario de Login -->
            <form id="form-login" novalidate>
              
              <!-- Campo: Usuario -->
              <div class="mb-3">
                <label for="login-username" class="form-label fw-semibold">Usuario <span class="text-danger">*</span></label>
                <input 
                  type="text" 
                  class="form-control" 
                  id="login-username" 
                  placeholder="username" 
                  required
                  autocomplete="username"
                >
                <div class="invalid-feedback">Ingresa un nombre de usuario.</div>
              </div>

              <!-- Campo: Contraseña -->
              <div class="mb-3">
                <label for="login-password" class="form-label fw-semibold">Contraseña <span class="text-danger">*</span></label>
                <input 
                  type="password" 
                  class="form-control" 
                  id="login-password" 
                  placeholder="••••••••" 
                  required
                  autocomplete="current-password"
                >
                <div class="invalid-feedback">Por favor, ingresa tu contraseña.</div>
              </div>

              <!-- Recordatorio de credenciales ficticias de prueba -->
              <div class="alert alert-info border-0 small py-2 px-3 mb-3">
                <strong>Credenciales de demostracion:</strong><br>
                Usuario: <code>ritmodedetalles</code><br>
                Contraseña: <code>admin123</code>
              </div>

              <!-- Contenedor para alerta de error/feedback de login -->
              <div id="login-feedback" class="mb-3 d-none"></div>

              <button type="submit" id="btn-login" class="btn button-color w-100 py-2 fw-bold text-white rounded-pill">
                Ingresar al Panel
              </button>
            </form>

          </div>

        </div>
      </div>
    </main>

    <footer class="custom-footer py-3 mt-auto text-center extra-small">
      <div class="container">
        <p class="mb-0">Ritmo de Detalles &copy; 2026 - Simulacion Administrativa</p>
      </div>
    </footer>

    <!-- Bootstrap JavaScript Bundle (includes Popper) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="js/app.js"></script>
  </body>
</html>
